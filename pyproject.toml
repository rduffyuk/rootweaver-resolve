[project]
name = "rootweaver-resolve"
version = "0.5.0"
description = "Inspectable retained Kubernetes investigations with genuine prior NVIDIA Nemotron analyses"
requires-python = ">=3.12"
dependencies = []
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
[project.urls]
Repository = "https://github.com/rduffyuk/rootweaver-resolve"
Documentation = "https://github.com/rduffyuk/rootweaver-resolve/blob/main/docs/BUILD.md"
[project.scripts]
resolve-demo = "rootweaver_resolve.retained_workspace:main"
resolve-synthetic = "rootweaver_resolve.demo:main"
[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/rootweaver_resolve"]
[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/scripts", "/reference", "/research", "/docs", "/README.md", "/CONTRIBUTING.md", "/LICENSE", "/pyproject.toml", "/requirements-build.txt", "/Makefile", "/AGENTS.md", "/SOURCE-ORIGINS.json", "/demo-freeze.json", "/demo-freeze.sha256", "/LIVE-FREEZE.sha256", "/devpost-submission.md"]
