<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860" role="img" aria-labelledby="title desc"><title id="title">Playback by default. Fresh analysis by choice.</title><desc id="desc">Default loopback playback reads local retained assets and makes no provider or cluster request. An explicit fresh-analysis action goes through same-origin validation, frozen inputs and a durable reservation before a Nebius Token Factory request. Results and receipts are separate from historical records. There is no cluster collector or remediation endpoint in this package. Animation illustrates direction only, not live traffic or measured timing.</desc><defs><marker id="action" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#7146e8"/></marker><marker id="result" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#64727a"/></marker><pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".6" fill="#ddd9d0"/></pattern><style></style></defs><rect width="1280" height="860" fill="#f7f6f2"/><g font-family="Arial, Helvetica, sans-serif"><text x="44" y="36" fill="#7146e8" font-size="12" font-weight="700" text-anchor="start">ROOTWEAVER RESOLVE / ATLAS / WHAT THE PACKAGE RUNS</text><text x="44" y="83" fill="#26313a" font-size="32" font-weight="600" text-anchor="start">Playback by default. Fresh analysis by choice.</text><text x="44" y="117" fill="#53606a" font-size="17" font-weight="400" text-anchor="start">The default viewer needs no credentials. Fresh inference uses one fixed HTTP evidence bundle.</text><rect x="40" y="150" width="1200" height="590" fill="url(#dots)"/><rect x="44" y="155" width="1192" height="250" rx="14" fill="#fff" fill-opacity=".45" stroke="#d9d7ce" stroke-dasharray="none"/><text x="62" y="182" fill="#53606a" font-size="14" font-weight="600" text-anchor="start">DEFAULT · LOCAL PLAYBACK · Browser, server and data on the operator’s machine</text><rect x="44" y="440" width="770" height="230" rx="14" fill="#fff" fill-opacity=".45" stroke="#d9d7ce" stroke-dasharray="none"/><text x="62" y="467" fill="#53606a" font-size="14" font-weight="600" text-anchor="start">OPT-IN · TRUSTED LOCAL SERVER · Private key and reservation state stay here</text><rect x="892" y="440" width="344" height="230" rx="14" fill="#fff" fill-opacity=".45" stroke="#d9d7ce" stroke-dasharray="6 5"/><text x="910" y="467" fill="#53606a" font-size="14" font-weight="600" text-anchor="start">EXTERNAL PROVIDER</text><path id="edge-0" d="M374,265 L484,265" fill="none" stroke="#7146e8" stroke-width="1.8" marker-end="url(#action)"/><rect x="382.0" y="228" width="94" height="25" rx="6" fill="#f7f6f2"/><text x="429" y="245" fill="#7146e8" font-size="15" font-weight="400" text-anchor="middle">read UI</text><path id="edge-1" d="M794,265 L904,265" fill="none" stroke="#7146e8" stroke-width="1.8" marker-end="url(#action)"/><rect x="799.0" y="228" width="100" height="25" rx="6" fill="#f7f6f2"/><text x="849" y="245" fill="#7146e8" font-size="15" font-weight="400" text-anchor="middle">read files</text><path id="edge-2" d="M904,340 L794,340" fill="none" stroke="#64727a" stroke-width="1.8" marker-end="url(#result)" stroke-dasharray="5 6"/><rect x="811.5" y="309" width="75" height="25" rx="6" fill="#f7f6f2"/><text x="849" y="326" fill="#53606a" font-size="15" font-weight="400" text-anchor="middle">data</text><path id="edge-3" d="M484,340 L374,340" fill="none" stroke="#64727a" stroke-width="1.8" marker-end="url(#result)" stroke-dasharray="5 6"/><rect x="390.0" y="309" width="78" height="25" rx="6" fill="#f7f6f2"/><text x="429" y="326" fill="#53606a" font-size="15" font-weight="400" text-anchor="middle">render</text><path id="edge-4" d="M374,550 L484,550" fill="none" stroke="#7146e8" stroke-width="1.8" marker-end="url(#action)"/><rect x="386.5" y="513" width="85" height="25" rx="6" fill="#f7f6f2"/><text x="429" y="530" fill="#7146e8" font-size="15" font-weight="400" text-anchor="middle">POST</text><path id="edge-5" d="M794,550 L904,550" fill="none" stroke="#7146e8" stroke-width="1.8" marker-end="url(#action)"/><rect x="805.0" y="513" width="88" height="25" rx="6" fill="#f7f6f2"/><text x="849" y="530" fill="#7146e8" font-size="15" font-weight="400" text-anchor="middle">HTTPS</text><path id="edge-6" d="M1060,642 L1060,702 L642,702 L642,642" fill="none" stroke="#64727a" stroke-width="1.8" marker-end="url(#result)" stroke-dasharray="5 6"/><rect x="776.0" y="680" width="168" height="25" rx="6" fill="#f7f6f2"/><text x="860" y="697" fill="#53606a" font-size="15" font-weight="400" text-anchor="middle">answer + receipt</text><path id="edge-7" d="M484,620 L374,620" fill="none" stroke="#64727a" stroke-width="1.8" marker-end="url(#result)" stroke-dasharray="5 6"/><rect x="377.5" y="591" width="103" height="25" rx="6" fill="#f7f6f2"/><text x="429" y="608" fill="#53606a" font-size="15" font-weight="400" text-anchor="middle">poll result</text><g data-node="browser"><rect x="64" y="218" width="310" height="144" rx="12" fill="#fff" stroke="#d9d7ce"/><circle cx="98" cy="253" r="22" fill="#f1ecff" stroke="#c9b8f7"/><g transform="translate(98,253) scale(.7)" fill="none" stroke="#7146e8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cy="-9" r="7"/><path d="M-15,17 V12 C-15,-1 15,-1 15,12 V17"/></g><text x="130" y="249" fill="#26313a" font-size="19" font-weight="600" text-anchor="start">Investigation UI</text><text x="130" y="272" fill="#7146e8" font-size="13" font-weight="400" text-anchor="start">Browser</text><text x="82" y="306" fill="#53606a" font-size="16" font-weight="400" text-anchor="start">Follow the recorded checks</text><text x="82" y="329" fill="#53606a" font-size="16" font-weight="400" text-anchor="start">Open complete evidence</text></g><g data-node="server"><rect x="484" y="218" width="310" height="144" rx="12" fill="#fff" stroke="#d9d7ce"/><circle cx="518" cy="253" r="22" fill="#f1ecff" stroke="#c9b8f7"/><g transform="translate(518,253) scale(.7)" fill="none" stroke="#7146e8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="-17" y="-12" width="34" height="24" rx="3"/><path d="M-11,-5 L-5,0 L-11,5 M0,6 H10"/></g><text x="550" y="249" fill="#26313a" font-size="19" font-weight="600" text-anchor="start">Loopback server</text><text x="550" y="272" fill="#7146e8" font-size="13" font-weight="400" text-anchor="start">Python standard library</text><text x="502" y="306" fill="#53606a" font-size="16" font-weight="400" text-anchor="start">Serve static workbench assets</text><text x="502" y="329" fill="#53606a" font-size="16" font-weight="400" text-anchor="start">No private platform dependency</text></g><g data-node="bundle"><rect x="904" y="218" width="310" height="144" rx="12" fill="#fff" stroke="#d9d7ce"/><circle cx="938" cy="253" r="22" fill="#f1ecff" stroke="#c9b8f7"/><g transform="translate(938,253) scale(.7)" fill="none" stroke="#7146e8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="0" cy="-10" rx="16" ry="6"/><path d="M-16,-10 V11 C-16,19 16,19 16,11 V-10 M-16,0 C-16,8 16,8 16,0"/></g><text x="970" y="249" fill="#26313a" font-size="19" font-weight="600" text-anchor="start">Retained bundle</text><text x="970" y="272" fill="#7146e8" font-size="13" font-weight="400" text-anchor="start">Local files</text><text x="922" y="306" fill="#53606a" font-size="16" font-weight="400" text-anchor="start">Captured evidence + old answers</text><text x="922" y="329" fill="#53606a" font-size="16" font-weight="400" text-anchor="start">Separate manifests and review notes</text></g><g data-node="request"><rect x="64" y="498" width="310" height="144" rx="12" fill="#fff" stroke="#d9d7ce"/><circle cx="98" cy="533" r="22" fill="#f1ecff" stroke="#c9b8f7"/><g transform="translate(98,533) scale(.7)" fill="none" stroke="#7146e8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cy="-9" r="7"/><path d="M-15,17 V12 C-15,-1 15,-1 15,12 V17"/></g><text x="130" y="529" fill="#26313a" font-size="19" font-weight="600" text-anchor="start">Explicit fresh request</text><text x="130" y="552" fill="#7146e8" font-size="13" font-weight="400" text-anchor="start">Other cases → HTTP analysis</text><text x="82" y="586" fill="#53606a" font-size="16" font-weight="400" text-anchor="start">Inspect the exact outgoing input</text><text x="82" y="609" fill="#53606a" font-size="16" font-weight="400" text-anchor="start">Human starts the request</text></g><g data-node="guard"><rect x="484" y="498" width="310" height="144" rx="12" fill="#fff" stroke="#d9d7ce"/><circle cx="518" cy="533" r="22" fill="#f1ecff" stroke="#c9b8f7"/><g transform="translate(518,533) scale(.7)" fill="none" stroke="#7146e8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M0,-18 L15,-11 V1 Q15,12 0,20 Q-15,12 -15,1 V-11 Z M-7,0 L-1,6 L8,-5"/></g><text x="550" y="529" fill="#26313a" font-size="19" font-weight="600" text-anchor="start">Server-side admission</text><text x="550" y="552" fill="#7146e8" font-size="13" font-weight="400" text-anchor="start">Credentials never enter the browser</text><text x="502" y="586" fill="#53606a" font-size="16" font-weight="400" text-anchor="start">Frozen files · durable reservation</text><text x="502" y="609" fill="#53606a" font-size="16" font-weight="400" text-anchor="start">Model / price preflight · no retries</text></g><g data-node="provider"><rect x="904" y="498" width="310" height="144" rx="12" fill="#fff" stroke="#d9d7ce"/><circle cx="938" cy="533" r="22" fill="#f1ecff" stroke="#c9b8f7"/><g transform="translate(938,533) scale(.7)" fill="none" stroke="#7146e8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M-15,-6 L0,-16 L15,-6 V10 L0,19 L-15,10 Z M-15,-6 L0,3 L15,-6 M0,3 V19"/></g><text x="970" y="529" fill="#26313a" font-size="19" font-weight="600" text-anchor="start">Nemotron Ultra</text><text x="970" y="552" fill="#7146e8" font-size="13" font-weight="400" text-anchor="start">Nebius Token Factory</text><text x="922" y="586" fill="#53606a" font-size="16" font-weight="400" text-anchor="start">Fixed HTTP evidence input</text><text x="922" y="609" fill="#53606a" font-size="16" font-weight="400" text-anchor="start">A new advisory answer</text></g><text x="64" y="738" fill="#53606a" font-size="16" font-weight="400" text-anchor="start">New results are separate from the historical answers. No cluster collector or remediation endpoint is shipped.</text><path d="M44,760 H1236" stroke="#d9d7ce"/><text x="44" y="790" fill="#53606a" font-size="14" font-weight="400" text-anchor="start">Solid arrows: action / request   ·   Dotted arrows: returned evidence / result</text><text x="44" y="820" fill="#53606a" font-size="14" font-weight="400" text-anchor="start">Current standalone source · Fresh inference is not new telemetry or a new packet investigation · Local server only.</text></g></svg>
