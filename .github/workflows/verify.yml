name: Verify standalone candidate
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install pinned build tools and standalone application
        run: |
          python -m pip install -r requirements-build.txt
          python -m pip install --no-build-isolation --no-deps .
      - name: Verify evidence custody and frozen application
        run: python scripts/verify_evidence.py
      - name: Python contract and application tests
        run: python -m unittest discover -s tests
      - name: JavaScript presentation tests
        run: node --test tests/*.mjs
      - name: Build wheel and source distribution
        run: python -m build --no-isolation
      - name: Test installed wheel outside the checkout
        run: python scripts/smoke_wheel.py
      - name: Retain verified build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rootweaver-resolve-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
